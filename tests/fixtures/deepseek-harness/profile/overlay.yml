# Cockpit overlay для штатного профиля acp. Генерируется на каждый запуск.
- id: "sandbox-policy"
  config:
    mode: "workspace-write"
    workspaceRoot: "{{CWD}}"
- id: "approval"
  config:
    policy: "ask"
- id: "permission"
  config:
    presets:
      read-only:
        sandbox: "read-only"
        approval: "ask"
      workspace-write:
        sandbox: "workspace-write"
        approval: "ask"
      danger-full-access:
        sandbox: "danger-full-access"
        approval: "never"
      factory-state-only:
        sandbox: "read-only"
        approval: "never"
      factory-workspace-write:
        sandbox: "workspace-write"
        approval: "never"
    defaultPreset: "workspace-write"
- id: "agent-instructions"
  config:
    maxBytes: 262144
- id: "subagent"
  disabled: true
- id: "subagent-spawn-in-process"
  disabled: true
- id: "subagent-fork-in-process"
  disabled: true
- id: "tool-subagent-control"
  disabled: true
- id: "tool-subagent-list-agents"
  disabled: true
- id: "tool-subagent"
  disabled: true
- id: "tool-subagent-fork"
  disabled: true
- id: "workflow-worker-thread"
  disabled: true
- id: "tool-workflow"
  disabled: true
- id: "tool-ralph"
  disabled: true
- id: "tool-jobs"
  disabled: true
- id: "web"
  disabled: true
- id: "web-search-deepseek"
  disabled: true
- id: "web-fetch-http"
  disabled: true
- id: "tool-web"
  disabled: true
- insert:
    - id: "hooks-claude-code"
      name: "@deepseek-ai/dsh-hooks-claude-code"
      config:
        configPath: "{{HOOKS_PATH}}"
        projectDir: "{{CWD}}"
