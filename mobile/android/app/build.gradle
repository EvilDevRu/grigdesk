apply plugin: 'com.android.application'

// Один номер версии для Java и bundled интерфейса.
// Выход за двухзначные minor/patch закрывает сборку, исключая коллизию versionCode.
def mobileVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def versionParts = mobileVersion.tokenize('.').collect { Integer.parseInt(it) }
if (versionParts.size() != 3 || versionParts[1] > 99 || versionParts[2] > 99) {
    throw new GradleException('Версия требует major.minor.patch, minor и patch от 0 до 99')
}
def mobileCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
if (mobileCode < 1 || mobileCode > 2100000000) {
    throw new GradleException('Номер версии вне допустимого диапазона Android')
}

android {
    namespace = "local.grigdesk.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "local.grigdesk.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileCode
        versionName mobileVersion
        aaptOptions {
            // Служебные и скрытые файлы не должны попасть в bundled интерфейс.
            // Настройка сохраняет общий список исключений AAPT для Capacitor assets.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            def androidUserDirectory = System.getenv('ANDROID_USER_HOME')
            if (androidUserDirectory) {
                storeFile new File(androidUserDirectory, 'debug.keystore')
            }
        }
        release {
            def signingFile = System.getenv('GRIGDESK_ANDROID_STORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('GRIGDESK_ANDROID_STORE_PASSWORD')
                keyPassword System.getenv('GRIGDESK_ANDROID_KEY_PASSWORD')
                keyAlias System.getenv('GRIGDESK_ANDROID_KEY_ALIAS')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('GRIGDESK_ANDROID_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
