      source_pin_id: ${{ steps.source_pin_upload.outputs.artifact-id }}
      source_pin_sha256: ${{ steps.source_pin.outputs.sha256 }}
      process_identity_sha256: ${{ steps.native_tools.outputs.process_sha }}
      setsid_sha256: ${{ steps.native_tools.outputs.setsid_sha }}
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime-darwin-arm64.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Нативное окружение Apple Silicon
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          /usr/bin/xcrun --sdk macosx --show-sdk-path
          /bin/df -Pk "$RUNNER_TEMP"
          test "$(/bin/df -Pk "$RUNNER_TEMP" | /usr/bin/awk 'NR == 2 { print $4 }')" -ge 16777216
          /opt/homebrew/bin/brew bundle --file=tools/ci/Brewfile.macos
      - name: План кандидатов по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-plan
          merge-multiple: true
      - name: Серверный receipt по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.server.outputs.receipt_id }}
          path: ${{ runner.temp }}/suite-server
          merge-multiple: true
      - name: Web receipt по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.web.outputs.receipt_id }}
          path: ${{ runner.temp }}/suite-web
          merge-multiple: true
      - name: Подтверждение общих проверок
        run: node tools/platformCandidate.mts receipts "$RUNNER_TEMP/suite-server" "$RUNNER_TEMP/suite-web"
      - name: Рабочий каталог кандидата
        run: mkdir -m 700 "$RUNNER_TEMP/candidate-work"
      - name: Подготовка нативных process identity и setsid
        id: native_tools
        run: node tools/ci/mac-candidate-bootstrap.mts compile "$RUNNER_TEMP/candidate-work/native"
      - name: Сборка двух версий без ключа подписи
        run: |
          for part in previous current; do
            scope="$RUNNER_TEMP/candidate-work/$part"
            mkdir -m 700 "$scope"
            node tools/platformCandidate.mts scope "$scope/source"
            node tools/ci/stage-platform-candidate.mts "$scope/source" "$scope/staging" "$part"
          done
      - name: Устойчивый результат source runtime pin
        id: source_pin
        run: |
          file="$RUNNER_TEMP/candidate-work/current/staging/receipts/mac-runtime-pin-source.json"
          test -f "$file"
          printf 'sha256=%s\n' "$(/usr/bin/shasum -a 256 "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Отдельный исходный runtime receipt
        id: source_pin_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-macos-source-pin-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-work/current/staging/receipts/mac-runtime-pin-source.json
          if-no-files-found: error
      - name: Подпись проверенного staging
        id: seal
        env:
          SIGNING_KEY: ${{ secrets.CANDIDATE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/grigdesk-candidate-key.XXXXXXXX")
          trap 'rm -f "$key"' EXIT
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          export CANDIDATE_SIGNING_KEY_FILE="$key"
          mkdir -m 700 "$RUNNER_TEMP/sealed-candidate"
          for part in previous current; do
            scope="$RUNNER_TEMP/candidate-work/$part"
            node "$scope/source/tools/platformCandidate.mts" seal darwin-arm64 "$part" \
              "$scope/staging/unsigned" "$scope/staging/unsigned.sha256" "$RUNNER_TEMP/sealed-candidate/$part"
          done
      - name: Нативные инструменты для отдельного verify
        run: |
          mkdir -m 700 "$RUNNER_TEMP/sealed-candidate/verify-tools"
          cp "$GRIGDESK_BUILD_PROCESS_HELPER" "$RUNNER_TEMP/sealed-candidate/verify-tools/process-identity"
          cp "$GRIGDESK_TEST_SETSID_BIN" "$RUNNER_TEMP/sealed-candidate/verify-tools/setsid"
      - name: Промежуточные файлы кандидата
        id: candidate_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-darwin-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-candidate/
          if-no-files-found: error
