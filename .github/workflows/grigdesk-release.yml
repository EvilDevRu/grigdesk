# План → проверки → сборка с подписью → проверка пакетов → публикация.
# Пропуск полных тестов является явным решением и сохраняется в выпуске.
name: Релиз GrigDesk — сборка и публикация
on:
  workflow_dispatch:
    inputs:
      linux:
        description: Собрать Linux x64
        type: boolean
        default: true
      macos:
        description: Собрать macOS Apple Silicon
        type: boolean
        default: true
      channel:
        description: Канал выпуска
        type: choice
        options:
          - release
          - dev
        default: dev
        required: true
      publish:
        description: Опубликовать проверенный выпуск
        type: boolean
        default: false
      notes:
        description: Описание RU/EN в JSON (необязательно)
        type: string
        default: ""
      validation_run:
        description: Успешный полный прогон тех же исходников для stable (необязательно)
        type: string
        default: ""
      test_mode:
        description: Полный набор тестов или согласованный пропуск
        type: choice
        options:
          - full
          - skip
        default: full
        required: true
      skip_reason:
        description: Причина явного пропуска тестов (для skip)
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: grigdesk-release
  cancel-in-progress: false
run-name: "${{ inputs.channel }}: ${{ inputs.test_mode }} — выпуск #${{ github.run_number }}"
jobs:
  plan:
    name: План и допуск выпуска
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      platforms: ${{ steps.accepted.outputs.platforms }}
      candidate_plan_sha256: ${{ steps.candidate_plan.outputs.digest }}
      recipe_digest: ${{ steps.candidate_plan.outputs.recipe_digest }}
      version: ${{ steps.candidate_plan.outputs.version }}
      previous_version: ${{ steps.candidate_plan.outputs.previous_version }}
      commit: ${{ steps.candidate_plan.outputs.commit }}
      release_id: ${{ steps.candidate_plan.outputs.release_id }}
      run_tests: ${{ steps.checks.outputs.run_tests }}
      require_pipeline_receipt: ${{ steps.checks.outputs.mode == 'full' && 'true' || 'false' }}
      mode: ${{ steps.checks.outputs.mode }}
      artifact_id: ${{ steps.plan_artifact.outputs.artifact-id }}
      source_digest: ${{ steps.source_identity.outputs.source_digest }}
    steps:
      - name: Выбор платформ
        id: accepted
        env:
          BUILD_LINUX: ${{ inputs.linux }}
          BUILD_MACOS: ${{ inputs.macos }}
        run: |
          case "$BUILD_LINUX/$BUILD_MACOS" in
            true/true) platforms=linux-and-macos ;;
            true/false) platforms=linux ;;
            false/true) platforms=macos ;;
            *) printf '::error::Выберите Linux x64 или macOS Apple Silicon.\n'; exit 1 ;;
          esac
          printf 'platforms=%s\n' "$platforms" >> "$GITHUB_OUTPUT"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Отпечаток исходников
        id: source_identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { sourceFingerprint } from './tools/distributionSnapshot.mts';
          const digest = await sourceFingerprint(process.cwd());
          await fs.appendFile(process.env.GITHUB_OUTPUT, `source_digest=${digest}\n`);
          NODE
      - name: План кандидатов
        if: ${{ inputs.macos }}
        id: candidate_plan
        env:
          CANDIDATE_PLATFORMS: ${{ steps.accepted.outputs.platforms }}
          CANDIDATE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_PUBLISH: ${{ inputs.publish }}
          CANDIDATE_TEST_MODE: ${{ inputs.test_mode }}
          CANDIDATE_SKIP_REASON: ${{ inputs.skip_reason }}
          CANDIDATE_VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          mkdir release-plan
          node tools/platformCandidate.mts plan release-plan/candidate-plan.json
      - name: Идентичность выпуска
        if: ${{ steps.accepted.outputs.platforms == 'linux' }}
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Происхождение выпуска из main
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |-
          if [ "$RELEASE_CHANNEL" = release ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - name: План проверок
        id: checks
        run: |-
          mkdir -p release-plan
          node tools/releaseChecks.mts plan release-plan/release-checks.json
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_SKIP_REASON: ${{ inputs.skip_reason }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
      - name: Подтверждение прежних проверок
        if: ${{ steps.accepted.outputs.platforms == 'linux' }}
        id: validation
        run: node tools/releaseValidation.mts
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          VALIDATION_RECEIPT: ${{ github.workspace }}/release-plan/validation-receipt.json
      - name: Сохранение плана
        id: plan_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-plan/
          if-no-files-found: error
  server:
    name: Сервер, shared и руководство
    outputs:
      receipt_id: ${{ steps.suite_receipt.outputs.artifact-id }}
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Идентичность кандидатов
        if: ${{ needs.plan.outputs.platforms != 'linux' }}
        env:
          CANDIDATE_VERSION: ${{ needs.plan.outputs.version }}
        run: node tools/platformCandidate.mts identity
      - name: Идентичность выпуска
        if: ${{ needs.plan.outputs.platforms == 'linux' }}
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Общая подготовка одноразового runner
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Пользовательский менеджер процессов тестов
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test_uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$test_uid.service"
          sudo systemctl set-property --runtime "user@$test_uid.service" MemoryMax=4G
          export XDG_RUNTIME_DIR="/run/user/$test_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          systemd-run --user --scope --collect --quiet \
            --unit="app-grigdesk-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.scope" -- true
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" \
            "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix routes ci --include=dev
          npm --prefix voice ci --include=dev
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Общий прогон серверных проверок
        id: server_tests
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -m
          getconf _NPROCESSORS_ONLN
          node tools/releasePipeline.mts tools/releaseRecipe.json --groups prepare-server,prepare-build,server
        env:
          GRIGDESK_PIPELINE_LOG: ${{ runner.temp }}/pipeline-receipts/server.log
          GRIGDESK_PIPELINE_RECEIPTS: ${{ runner.temp }}/pipeline-receipts
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Выгрузка receipts прогона
        id: suite_receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-pipeline-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-receipts/
          if-no-files-found: error
    needs:
      - plan
  web:
    name: Web-проверки
    outputs:
      receipt_id: ${{ steps.suite_receipt.outputs.artifact-id }}
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность кандидатов
        if: ${{ needs.plan.outputs.platforms != 'linux' }}
        env:
          CANDIDATE_VERSION: ${{ needs.plan.outputs.version }}
        run: node tools/platformCandidate.mts identity
      - name: Идентичность выпуска
        if: ${{ needs.plan.outputs.platforms == 'linux' }}
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Общая подготовка одноразового runner
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix routes ci --include=dev
          npm --prefix voice ci --include=dev
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci --ignore-scripts
          node desktop/node_modules/esbuild/install.js
      - name: Общий прогон web-проверок
        run: node tools/releasePipeline.mts tools/releaseRecipe.json --groups prepare-web,prepare-build,web
        env:
          GRIGDESK_PIPELINE_LOG: ${{ runner.temp }}/pipeline-receipts/web.log
          GRIGDESK_PIPELINE_RECEIPTS: ${{ runner.temp }}/pipeline-receipts
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Выгрузка receipts прогона
        id: suite_receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-pipeline-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-receipts/
          if-no-files-found: error
    needs:
      - plan
  build:
    name: Сборка и подпись
    needs:
      - plan
      - server
      - web
    if: ${{ !cancelled() && needs.plan.outputs.platforms == 'linux' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: release-plan
          merge-multiple: true
      - name: Подтверждение всех проверок
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: node tools/releaseChecks.mts gate release-plan/release-checks.json
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Общая подготовка одноразового runner
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix routes ci --include=dev
          npm --prefix voice ci --include=dev
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci --ignore-scripts
          node desktop/node_modules/esbuild/install.js
      - name: Закреплённые Electron и инструменты AppImage
        run: |
          target="$RUNNER_TEMP/appimage-tools"
          bash tools/ci/prepare-release-desktop.sh "$target"
          printf '%s\n' "GRIGDESK_APPIMAGE_TOOLS_PATH=$target" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Проверка механизма подтверждения CI
        run: NODE_TEST_MAX_RSS_MB=2048 bash tests/run-node-tests-safe.sh --test --test-concurrency=2
          tests/server/release-validation.test.js tests/server/release-workflow.test.js
          tests/relay/release-workflow.test.js tests/server/release-checks.test.js
          tests/server/installer-archive-tail.test.js
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Общая сборка web
        run: node tools/releasePipeline.mts tools/releaseRecipe.json --groups build
        env:
          GRIGDESK_PIPELINE_LOG: ${{ runner.temp }}/pipeline-receipts/build.log
          GRIGDESK_PIPELINE_RECEIPTS: ${{ runner.temp }}/pipeline-receipts
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Receipts прогонов проверок
        if: ${{ needs.plan.outputs.run_tests == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: grigdesk-pipeline-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-receipts
          merge-multiple: true
      - name: Освобождение тестовых артефактов
        run: |
          test "$GRIGDESK_TEST_DEEPSEEK_ROOT" = "$RUNNER_TEMP/deepseek-tests"
          rm -rf -- "$GRIGDESK_TEST_DEEPSEEK_ROOT"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Ключ подписи
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-signing.pem"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
      - name: Описание проверок в подписанном выпуске
        run: node tools/releaseChecks.mts notes release-plan/release-checks.json
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
      - name: Сборка комплекта
        run: GRIGDESK_RELEASE_SIGNING_KEY="$RUNNER_TEMP/release-signing.pem" node tools/bundle.mts 3>&1
        env:
          GRIGDESK_CTL_BUILD_OBSERVED: '1'
          GRIGDESK_RELEASE_ORIGIN: ${{ secrets.RELEASE_SITE_PUBLIC_ORIGIN || 'https://grigdesk.com' }}
      - name: Deb-пакет
        run: node tools/buildDeb.mts
      - name: Свидетельство проверок
        run: |-
          cp release-plan/*.json release-artifacts/
          if ls "$RUNNER_TEMP"/pipeline-receipts/pipeline-*.json >/dev/null 2>&1; then
            cp "$RUNNER_TEMP"/pipeline-receipts/pipeline-*.json release-artifacts/
          fi
          node tools/releaseChecks.mts attach release-artifacts/release-checks.json
      - name: Артефакты проверочного выпуска
        id: artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-${{ inputs.channel }}-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
  verify:
    name: Проверка готовых пакетов
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.plan.outputs.platforms == 'linux' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Зависимости проверки
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Проверка готовых пакетов
        run: NODE_TEST_MAX_RSS_MB=4096 NODE_TEST_HEAP_MB=1024 bash tests/run-node-tests-safe.sh tools/verifyRelease.mts release-artifacts
        env:
          GRIGDESK_RELEASE_REQUIRE_PIPELINE_RECEIPT: ${{ needs.plan.outputs.require_pipeline_receipt }}
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Сохранение результата проверки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/verified-proof.json
          if-no-files-found: error
  publish:
    name: Публикация на сайт
    needs:
      - plan
      - build
      - verify
    if: >-
      ${{ !cancelled() && inputs.publish && needs.plan.outputs.platforms == 'linux' && needs.plan.result == 'success' &&
      needs.build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Зависимости публикации
        run: npm --prefix server ci
      - name: Ключ сайта
        env:
          SITE_KEY: ${{ secrets.RELEASE_SITE_KEY }}
          MIRROR_KEY: ${{ secrets.RELEASE_SITE_MIRROR_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-site-key"
          printf '%s' "$SITE_KEY" > "$RUNNER_TEMP/release-site-key"
          if [ -n "$MIRROR_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/release-site-mirror-key"
            printf '%s' "$MIRROR_KEY" > "$RUNNER_TEMP/release-site-mirror-key"
          fi
      - name: Публикация на сайт
        run: node tools/release-publish.mts "$PWD"
        env:
          RELEASE_SITE_HOST: ${{ secrets.RELEASE_SITE_HOST }}
          RELEASE_SITE_USER: ${{ secrets.RELEASE_SITE_USER }}
          RELEASE_SITE_PORT: ${{ secrets.RELEASE_SITE_PORT || '22' }}
          RELEASE_SITE_KEY: ${{ runner.temp }}/release-site-key
          RELEASE_SITE_DIR: ${{ secrets.RELEASE_SITE_DIR }}
          RELEASE_SITE_PUBLIC_ORIGIN: ${{ secrets.RELEASE_SITE_PUBLIC_ORIGIN }}
          RELEASE_SITE_MIRROR_HOST: ${{ secrets.RELEASE_SITE_MIRROR_HOST }}
          RELEASE_SITE_MIRROR_USER: ${{ secrets.RELEASE_SITE_MIRROR_USER }}
          RELEASE_SITE_MIRROR_PORT: ${{ secrets.RELEASE_SITE_MIRROR_PORT || '22' }}
          RELEASE_SITE_MIRROR_KEY: ${{ runner.temp }}/release-site-mirror-key
          RELEASE_SITE_MIRROR_DIR: ${{ secrets.RELEASE_SITE_MIRROR_DIR }}
          RELEASE_SITE_MIRROR_PUBLIC_ORIGIN: ${{ secrets.RELEASE_SITE_MIRROR_PUBLIC_ORIGIN }}

  linux_candidate_build:
    name: Сборка кандидата Linux x64
    needs: [plan, server, web]
    environment: platform-candidate
    if: ${{ success() && needs.plan.outputs.platforms == 'linux-and-macos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_PLATFORMS: ${{ needs.plan.outputs.platforms }}
      CANDIDATE_PLAN_SHA256: ${{ needs.plan.outputs.candidate_plan_sha256 }}
      CANDIDATE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      CANDIDATE_RECIPE_DIGEST: ${{ needs.plan.outputs.recipe_digest }}
      CANDIDATE_VERSION: ${{ needs.plan.outputs.version }}
      CANDIDATE_PREVIOUS_VERSION: ${{ needs.plan.outputs.previous_version }}
      CANDIDATE_PUBLIC_KEY_B64: ${{ vars.CANDIDATE_PUBLIC_KEY_B64 }}
      CANDIDATE_NOTES_JSON: ${{ inputs.notes }}
    outputs:
      artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      public_key: ${{ steps.seal.outputs.public_key }}
      signer_fingerprint: ${{ steps.seal.outputs.signer_fingerprint }}
      manifest_digest: ${{ steps.seal.outputs.current_digest }}
      file_digest: ${{ steps.seal.outputs.current_file_digest }}
      previous_manifest_digest: ${{ steps.seal.outputs.previous_digest }}
      previous_file_digest: ${{ steps.seal.outputs.previous_file_digest }}
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Ubuntu для сборки кандидата
        run: |
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: План кандидатов по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-plan
          merge-multiple: true
      - name: Серверный receipt по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.server.outputs.receipt_id }}
          path: ${{ runner.temp }}/suite-server
          merge-multiple: true
      - name: Web receipt по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.web.outputs.receipt_id }}
          path: ${{ runner.temp }}/suite-web
          merge-multiple: true
      - name: Подтверждение общих проверок
        run: node tools/platformCandidate.mts receipts "$RUNNER_TEMP/suite-server" "$RUNNER_TEMP/suite-web"
      - name: Рабочий каталог кандидата
        run: mkdir -m 700 "$RUNNER_TEMP/candidate-work"
      - name: Сборка двух версий без ключа подписи
        run: |
          for part in previous current; do
            scope="$RUNNER_TEMP/candidate-work/$part"
            mkdir -m 700 "$scope"
            node tools/platformCandidate.mts scope "$scope/source"
            node tools/ci/stage-platform-candidate.mts "$scope/source" "$scope/staging" "$part"
          done
      - name: Подпись проверенного staging
        id: seal
        env:
          SIGNING_KEY: ${{ secrets.CANDIDATE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/grigdesk-candidate-key.XXXXXXXX")
          trap 'rm -f "$key"' EXIT
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          export CANDIDATE_SIGNING_KEY_FILE="$key"
          mkdir -m 700 "$RUNNER_TEMP/sealed-candidate"
          for part in previous current; do
            scope="$RUNNER_TEMP/candidate-work/$part"
            node "$scope/source/tools/platformCandidate.mts" seal linux-x64 "$part" \
              "$scope/staging/unsigned" "$scope/staging/unsigned.sha256" "$RUNNER_TEMP/sealed-candidate/$part"
          done
      - name: Промежуточные файлы кандидата
        id: candidate_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-linux-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-candidate/
          if-no-files-found: error
  linux_candidate_verify:
    name: Проверка кандидата Linux x64
    needs: [plan, linux_candidate_build]
    if: ${{ success() && needs.plan.outputs.platforms == 'linux-and-macos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CANDIDATE_PLATFORMS: ${{ needs.plan.outputs.platforms }}
      CANDIDATE_PLAN_SHA256: ${{ needs.plan.outputs.candidate_plan_sha256 }}
      CANDIDATE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      CANDIDATE_RECIPE_DIGEST: ${{ needs.plan.outputs.recipe_digest }}
      CANDIDATE_VERSION: ${{ needs.plan.outputs.version }}
      CANDIDATE_PREVIOUS_VERSION: ${{ needs.plan.outputs.previous_version }}
      BUILD_PUBLIC_KEY: ${{ needs.linux_candidate_build.outputs.public_key }}
      BUILD_SIGNER_FINGERPRINT: ${{ needs.linux_candidate_build.outputs.signer_fingerprint }}
      BUILD_MANIFEST_DIGEST: ${{ needs.linux_candidate_build.outputs.manifest_digest }}
      BUILD_FILE_DIGEST: ${{ needs.linux_candidate_build.outputs.file_digest }}
      BUILD_PREVIOUS_MANIFEST_DIGEST: ${{ needs.linux_candidate_build.outputs.previous_manifest_digest }}
      BUILD_PREVIOUS_FILE_DIGEST: ${{ needs.linux_candidate_build.outputs.previous_file_digest }}
    outputs:
      artifact_id: ${{ steps.verified_upload.outputs.artifact-id }}
      public_key: ${{ steps.validation.outputs.public_key }}
      signer_fingerprint: ${{ steps.validation.outputs.signer_fingerprint }}
      manifest_digest: ${{ steps.validation.outputs.manifest_digest }}
      file_digest: ${{ steps.validation.outputs.file_digest }}
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Системные зависимости проверки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libfuse2t64 ffmpeg ripgrep iproute2 strace
      - name: План кандидатов по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-plan
          merge-multiple: true
      - name: Готовые A и B по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux_candidate_build.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-input
          merge-multiple: true
      - name: Проверка готовых комплектов
        id: validation
        run: |
          keep=RUNNER_TEMP,GITHUB_SHA,GITHUB_OUTPUT,CANDIDATE_PLAN_SHA256,CANDIDATE_SOURCE_DIGEST
          keep+=,GITHUB_REF,GITHUB_RUN_NUMBER,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID
          keep+=,CANDIDATE_RECIPE_DIGEST,CANDIDATE_VERSION,CANDIDATE_PREVIOUS_VERSION,CANDIDATE_PLATFORMS
          keep+=,BUILD_PUBLIC_KEY,BUILD_SIGNER_FINGERPRINT,BUILD_MANIFEST_DIGEST,BUILD_FILE_DIGEST
          keep+=,BUILD_PREVIOUS_MANIFEST_DIGEST,BUILD_PREVIOUS_FILE_DIGEST
          sudo --preserve-env="$keep" /usr/bin/unshare --net /bin/bash -euc '
            /usr/sbin/ip link set lo up
            uid=$1 gid=$2 runner_path=$3 runner_home=$4
            shift 4
            exec /usr/bin/setpriv --reuid "$uid" --regid "$gid" --init-groups \
              /usr/bin/env PATH="$runner_path" HOME="$runner_home" GRIGDESK_ACCEPTANCE_NETNS=1 "$@"
          ' bash "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$(command -v node)" \
            tools/platformCandidate.mts verify linux-x64 "$RUNNER_TEMP/candidate-input/current" \
            "$RUNNER_TEMP/candidate-input/previous" "$RUNNER_TEMP/verified-candidate"
      - name: Промежуточный проверенный комплект
        id: verified_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-verified-linux-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-candidate/
          if-no-files-found: error
  macos_build:
    name: Сборка кандидата macOS ARM64
    needs: [plan, server, web]
