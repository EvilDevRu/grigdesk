# План → проверки → сборка с подписью → проверка пакетов → публикация.
# Пропуск полных тестов является явным решением и сохраняется в выпуске.
name: Релиз GrigDesk — сборка и публикация
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Канал выпуска
        type: choice
        options:
          - release
          - dev
        default: release
        required: true
      publish:
        description: Опубликовать проверенный выпуск
        type: boolean
        default: false
      notes:
        description: Описание RU/EN в JSON (необязательно)
        type: string
        default: ""
      validation_run:
        description: Успешный полный прогон тех же исходников для stable (необязательно)
        type: string
        default: ""
      test_mode:
        description: Полный набор тестов или согласованный пропуск
        type: choice
        options:
          - full
          - skip
        default: full
        required: true
      skip_reason:
        description: Причина явного пропуска тестов (для skip)
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: grigdesk-release
  cancel-in-progress: false
jobs:
  plan:
    name: План и допуск выпуска
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_tests: ${{ steps.checks.outputs.run_tests }}
      mode: ${{ steps.checks.outputs.mode }}
      artifact_id: ${{ steps.plan_artifact.outputs.artifact-id }}
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Происхождение выпуска из main
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |-
          if [ "$RELEASE_CHANNEL" = release ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - name: План проверок
        id: checks
        run: |-
          mkdir release-plan
          node tools/releaseChecks.mts plan release-plan/release-checks.json
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_SKIP_REASON: ${{ inputs.skip_reason }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
      - name: Подтверждение прежних проверок
        id: validation
        run: node tools/releaseValidation.mts
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          VALIDATION_RECEIPT: ${{ github.workspace }}/release-plan/validation-receipt.json
      - name: Сохранение плана
        id: plan_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-plan/
          if-no-files-found: error
  server:
    name: Сервер, shared и руководство
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-tests/node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Песочница native-проверок
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          sudo tee /etc/apparmor.d/grigdesk-ci-bwrap > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-bwrap
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- /usr/bin/true
          sudo tee /etc/apparmor.d/grigdesk-ci-unshare > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-unshare
          unshare -Urnm /usr/bin/true
      - name: Системные средства тестов
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg ripgrep python3-pil
          ffmpeg -version
          ffprobe -version
          rg --version
          python3 -c 'from PIL import Image; print(Image.__version__)'
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Браузер тестов
        run: node server/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Песочница Chromium
        run: >
          index=0

          while IFS= read -r browser; do
            index=$((index + 1))
            profile="/etc/apparmor.d/grigdesk-ci-chromium-$index"
            sudo tee "$profile" > /dev/null <<APPARMOR
          abi <abi/4.0>,

          include <tunables/global>

          profile grigdesk-ci-chromium-$index "$browser" flags=(unconfined) {
            userns,
          }

          APPARMOR
            sudo apparmor_parser -r "$profile"
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell
          \))

          test "$index" -gt 0

          node --input-type=module <<'NODE'

          import { chromium } from './server/node_modules/playwright-core/index.mjs';


          for (const channel of [undefined, 'chromium']) {
            const browser = await chromium.launch({ headless: true, chromiumSandbox: true, channel });

            try {
              const page = await browser.newPage();

              await page.goto('data:text/html,<title>sandbox probe</title>');

              if (await page.title() !== 'sandbox probe') {
                throw new Error('chromium_sandbox_probe_failed');
              }
            } finally {
              await browser.close();
            }
          }

          NODE
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Прогрев вариантов тестового ELF
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh tests/helpers/deepseekBinary.mts
          --prepare-suite > "$RUNNER_TEMP/deepseek-test-suite.json"
      - name: Прогрев среды миграции
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh tests/helpers/deepseekRuntimeArtifact.mts
      - name: Проверка тестового ELF
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh --test
          tests/server/deepseek-binary-cache-root.test.js
      - name: Тесты сервера
        id: server_tests
        continue-on-error: true
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -m
          getconf _NPROCESSORS_ONLN
          available_kib=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          if [ "$available_kib" -lt 16777216 ]; then
            printf '%s\n' "Для полного native-набора нужно 16 GiB; доступно $available_kib KiB"
            exit 1
          fi
          npm --prefix server test
      - name: Тесты shared-контрактов
        id: shared_tests
        continue-on-error: true
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh --test --test-concurrency=2
          tests/shared/*.test.mts
      - name: Руководство выпуска
        id: guide_tests
        continue-on-error: true
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh --test --test-concurrency=2
          tests/docs/help-guide.test.mts tests/docs/markdown-links.test.mjs
      - name: Подтверждение серверных проверок
        if: ${{ !cancelled() }}
        env:
          SERVER_RESULT: ${{ steps.server_tests.outcome }}
          SHARED_RESULT: ${{ steps.shared_tests.outcome }}
          GUIDE_RESULT: ${{ steps.guide_tests.outcome }}
        run: |
          printf '%s\n' "server=$SERVER_RESULT" "shared=$SHARED_RESULT" "guide=$GUIDE_RESULT"
          test "$SERVER_RESULT" = success
          test "$SHARED_RESULT" = success
          test "$GUIDE_RESULT" = success
    needs:
      - plan
  web:
    name: Web-проверки
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-tests/node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Песочница native-проверок
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          sudo tee /etc/apparmor.d/grigdesk-ci-bwrap > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-bwrap
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- /usr/bin/true
          sudo tee /etc/apparmor.d/grigdesk-ci-unshare > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-unshare
          unshare -Urnm /usr/bin/true
      - name: Системные средства тестов
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg ripgrep python3-pil
          ffmpeg -version
          ffprobe -version
          rg --version
          python3 -c 'from PIL import Image; print(Image.__version__)'
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Браузер тестов
        run: node server/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Песочница Chromium
        run: >
          index=0

          while IFS= read -r browser; do
            index=$((index + 1))
            profile="/etc/apparmor.d/grigdesk-ci-chromium-$index"
            sudo tee "$profile" > /dev/null <<APPARMOR
          abi <abi/4.0>,

          include <tunables/global>

          profile grigdesk-ci-chromium-$index "$browser" flags=(unconfined) {
            userns,
          }

          APPARMOR
            sudo apparmor_parser -r "$profile"
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell
          \))

          test "$index" -gt 0

          node --input-type=module <<'NODE'

          import { chromium } from './server/node_modules/playwright-core/index.mjs';


          for (const channel of [undefined, 'chromium']) {
            const browser = await chromium.launch({ headless: true, chromiumSandbox: true, channel });

            try {
              const page = await browser.newPage();

              await page.goto('data:text/html,<title>sandbox probe</title>');

              if (await page.title() !== 'sandbox probe') {
                throw new Error('chromium_sandbox_probe_failed');
              }
            } finally {
              await browser.close();
            }
          }

          NODE
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Тесты web
        id: web_tests
        run: npm --prefix web test
        env:
          NODE_OPTIONS: --test-reporter=tap
    needs:
      - plan
  build:
    name: Сборка и подпись
    needs:
      - plan
      - server
      - web
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-tests/node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: release-plan
          merge-multiple: true
      - name: Подтверждение всех проверок
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: node tools/releaseChecks.mts gate release-plan/release-checks.json
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Песочница native-проверок
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          sudo tee /etc/apparmor.d/grigdesk-ci-bwrap > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-bwrap
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- /usr/bin/true
          sudo tee /etc/apparmor.d/grigdesk-ci-unshare > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-unshare
          unshare -Urnm /usr/bin/true
      - name: Системные средства тестов
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg ripgrep python3-pil
          ffmpeg -version
          ffprobe -version
          rg --version
          python3 -c 'from PIL import Image; print(Image.__version__)'
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Проверка механизма подтверждения CI
        run: NODE_TEST_MAX_RSS_MB=2048 bash tests/run-node-tests-safe.sh --test --test-concurrency=2
          tests/server/release-validation.test.js tests/server/release-workflow.test.js
          tests/relay/release-workflow.test.js tests/server/release-checks.test.js
          tests/server/installer-archive-tail.test.js
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Production-сборка web
        run: npm --prefix web run build
      - name: Освобождение тестовых артефактов
        run: |
          test "$GRIGDESK_TEST_DEEPSEEK_ROOT" = "$RUNNER_TEMP/deepseek-tests"
          rm -rf -- "$GRIGDESK_TEST_DEEPSEEK_ROOT"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Ключ подписи
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-signing.pem"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
      - name: Описание проверок в подписанном выпуске
        run: node tools/releaseChecks.mts notes release-plan/release-checks.json
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
      - name: Сборка комплекта
        run: GRIGDESK_RELEASE_SIGNING_KEY="$RUNNER_TEMP/release-signing.pem" node tools/bundle.mts
        env:
          GRIGDESK_RELEASE_ORIGIN: ${{ secrets.RELEASE_SITE_PUBLIC_ORIGIN || 'https://grigdesk.com' }}
      - name: Deb-пакет
        run: node tools/buildDeb.mts
      - name: Свидетельство проверок
        run: |-
          cp release-plan/*.json release-artifacts/
          node tools/releaseChecks.mts attach release-artifacts/release-checks.json
      - name: Артефакты проверочного выпуска
        id: artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-${{ inputs.channel }}-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
  verify:
    name: Проверка готовых пакетов
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Зависимости проверки
        run: npm --prefix server ci
      - name: Проверка готовых пакетов
        run: NODE_TEST_MAX_RSS_MB=4096 NODE_TEST_HEAP_MB=1024 bash tests/run-node-tests-safe.sh
          tools/verifyRelease.mts release-artifacts
      - name: Сохранение результата проверки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/verified-proof.json
          if-no-files-found: error
  publish:
    name: Публикация на сайт
    needs:
      - plan
      - build
      - verify
    if: >-
      ${{ !cancelled() && inputs.publish && needs.plan.result == 'success' &&
      needs.build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Зависимости публикации
        run: npm --prefix server ci
      - name: Ключ сайта
        env:
          SITE_KEY: ${{ secrets.RELEASE_SITE_KEY }}
          MIRROR_KEY: ${{ secrets.RELEASE_SITE_MIRROR_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-site-key"
          printf '%s' "$SITE_KEY" > "$RUNNER_TEMP/release-site-key"
          if [ -n "$MIRROR_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/release-site-mirror-key"
            printf '%s' "$MIRROR_KEY" > "$RUNNER_TEMP/release-site-mirror-key"
          fi
      - name: Публикация на сайт
        run: node tools/release-publish.mts "$PWD"
        env:
          RELEASE_SITE_HOST: ${{ secrets.RELEASE_SITE_HOST }}
          RELEASE_SITE_USER: ${{ secrets.RELEASE_SITE_USER }}
          RELEASE_SITE_PORT: ${{ secrets.RELEASE_SITE_PORT || '22' }}
          RELEASE_SITE_KEY: ${{ runner.temp }}/release-site-key
          RELEASE_SITE_DIR: ${{ secrets.RELEASE_SITE_DIR }}
          RELEASE_SITE_PUBLIC_ORIGIN: ${{ secrets.RELEASE_SITE_PUBLIC_ORIGIN }}
          RELEASE_SITE_MIRROR_HOST: ${{ secrets.RELEASE_SITE_MIRROR_HOST }}
          RELEASE_SITE_MIRROR_USER: ${{ secrets.RELEASE_SITE_MIRROR_USER }}
          RELEASE_SITE_MIRROR_PORT: ${{ secrets.RELEASE_SITE_MIRROR_PORT || '22' }}
          RELEASE_SITE_MIRROR_KEY: ${{ runner.temp }}/release-site-mirror-key
          RELEASE_SITE_MIRROR_DIR: ${{ secrets.RELEASE_SITE_MIRROR_DIR }}
          RELEASE_SITE_MIRROR_PUBLIC_ORIGIN: ${{ secrets.RELEASE_SITE_MIRROR_PUBLIC_ORIGIN }}
run-name: "${{ inputs.channel }}: ${{ inputs.test_mode }} — выпуск #${{ github.run_number }}"
