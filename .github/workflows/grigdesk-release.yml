# План → проверки → сборка с подписью → проверка пакетов → публикация.
# Пропуск полных тестов является явным решением и сохраняется в выпуске.
name: Релиз GrigDesk — сборка и публикация
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Канал выпуска
        type: choice
        options:
          - release
          - dev
        default: release
        required: true
      publish:
        description: Опубликовать проверенный выпуск
        type: boolean
        default: false
      notes:
        description: Описание RU/EN в JSON (необязательно)
        type: string
        default: ""
      validation_run:
        description: Успешный полный прогон тех же исходников для stable (необязательно)
        type: string
        default: ""
      test_mode:
        description: Полный набор тестов или согласованный пропуск
        type: choice
        options:
          - full
          - skip
        default: full
        required: true
      skip_reason:
        description: Причина явного пропуска тестов (для skip)
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: grigdesk-release
  cancel-in-progress: false
jobs:
  plan:
    name: План и допуск выпуска
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_tests: ${{ steps.checks.outputs.run_tests }}
      require_pipeline_receipt: ${{ steps.checks.outputs.mode == 'full' && 'true' || 'false' }}
      mode: ${{ steps.checks.outputs.mode }}
      artifact_id: ${{ steps.plan_artifact.outputs.artifact-id }}
      source_digest: ${{ steps.source_identity.outputs.source_digest }}
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Отпечаток исходников
        id: source_identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { sourceFingerprint } from './tools/distributionSnapshot.mts';
          const digest = await sourceFingerprint(process.cwd());
          await fs.appendFile(process.env.GITHUB_OUTPUT, `source_digest=${digest}\n`);
          NODE
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Происхождение выпуска из main
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |-
          if [ "$RELEASE_CHANNEL" = release ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - name: План проверок
        id: checks
        run: |-
          mkdir release-plan
          node tools/releaseChecks.mts plan release-plan/release-checks.json
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_SKIP_REASON: ${{ inputs.skip_reason }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
      - name: Подтверждение прежних проверок
        id: validation
        run: node tools/releaseValidation.mts
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          VALIDATION_RECEIPT: ${{ github.workspace }}/release-plan/validation-receipt.json
      - name: Сохранение плана
        id: plan_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-plan/
          if-no-files-found: error
  server:
    name: Сервер, shared и руководство
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Общая подготовка одноразового runner
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Настоящий CLI Qwen
        run: |
          npm --prefix tests/fixtures/qwen-cli ci --no-audit --no-fund
          printf '%s\n' \
            "GRIGDESK_QWEN_BIN=$GITHUB_WORKSPACE/tests/fixtures/qwen-cli/node_modules/@qwen-code/qwen-code/cli-entry.js" \
            >> "$GITHUB_ENV"
      - name: Пользовательский менеджер процессов тестов
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test_uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$test_uid.service"
          sudo systemctl set-property --runtime "user@$test_uid.service" MemoryMax=4G
          export XDG_RUNTIME_DIR="/run/user/$test_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          systemd-run --user --scope --collect --quiet \
            --unit="app-grigdesk-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.scope" -- true
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" \
            "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix routes ci --include=dev
          npm --prefix voice ci --include=dev
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Общий прогон серверных проверок
        id: server_tests
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -m
          getconf _NPROCESSORS_ONLN
          systemd-run --user --scope --collect --quiet \
            --unit="app-grigdesk-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.scope" \
            -- node tools/releasePipeline.mts tools/releaseRecipe.json --groups prepare-server,prepare-build,server
        env:
          GRIGDESK_PIPELINE_LOG: ${{ runner.temp }}/pipeline-receipts/server.log
          GRIGDESK_PIPELINE_RECEIPTS: ${{ runner.temp }}/pipeline-receipts
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Выгрузка receipts прогона
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-pipeline-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-receipts/
          if-no-files-found: error
    needs:
      - plan
  web:
    name: Web-проверки
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Общая подготовка одноразового runner
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix routes ci --include=dev
          npm --prefix voice ci --include=dev
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci --ignore-scripts
          node desktop/node_modules/esbuild/install.js
      - name: Общий прогон web-проверок
        run: node tools/releasePipeline.mts tools/releaseRecipe.json --groups prepare-web,prepare-build,web
        env:
          GRIGDESK_PIPELINE_LOG: ${{ runner.temp }}/pipeline-receipts/web.log
          GRIGDESK_PIPELINE_RECEIPTS: ${{ runner.temp }}/pipeline-receipts
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Выгрузка receipts прогона
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-pipeline-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-receipts/
          if-no-files-found: error
    needs:
      - plan
  build:
    name: Сборка и подпись
    needs:
      - plan
      - server
      - web
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: release-plan
          merge-multiple: true
      - name: Подтверждение всех проверок
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: node tools/releaseChecks.mts gate release-plan/release-checks.json
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Общая подготовка одноразового runner
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix routes ci --include=dev
          npm --prefix voice ci --include=dev
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci --ignore-scripts
          node desktop/node_modules/esbuild/install.js
      - name: Закреплённый Electron
        run: |
          sudo apt-get install -y --no-install-recommends unzip
          version="$(node -p "require('./desktop/package.json').devDependencies.electron")"
          archive="electron-v$version-linux-x64.zip"
          target="$RUNNER_TEMP/electron-runtime"
          mkdir -p "$target"
          for attempt in 1 2 3; do
            if gh release download "v$version" --repo electron/electron --pattern "$archive" \
              --pattern SHASUMS256.txt --dir "$target" --clobber; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
          test -s "$target/$archive"
          (cd "$target" && sha256sum --check --strict --ignore-missing SHASUMS256.txt)
          checksum="$(node -p 'require("./desktop/node_modules/electron/checksums.json")[process.argv[1]]' \
            "$archive")"
          printf '%s  %s\n' "$checksum" "$target/$archive" | sha256sum --check --strict
          unzip -q "$target/$archive" -d desktop/node_modules/electron/dist
          test "$(cat desktop/node_modules/electron/dist/version)" = "$version"
          if test -f desktop/node_modules/electron/dist/electron.d.ts; then
            mv desktop/node_modules/electron/dist/electron.d.ts desktop/node_modules/electron/electron.d.ts
          fi
          printf '%s' electron > desktop/node_modules/electron/path.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Закреплённые инструменты AppImage
        run: |
          sudo apt-get install -y --no-install-recommends p7zip-full
          target="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$target"
          for attempt in 1 2 3; do
            if gh release download appimage-12.0.1 --repo electron-userland/electron-builder-binaries \
              --pattern appimage-12.0.1.7z --dir "$target" --clobber; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
          printf '%s  %s\n' d12ff7eb8f1d1ec4652ca5237a7fbdca33acc0c758045636feca62dc6ecb8ec4 \
            "$target/appimage-12.0.1.7z" | sha256sum --check --strict
          7z x -y "-o$target/extracted" "$target/appimage-12.0.1.7z"
          echo "GRIGDESK_APPIMAGE_TOOLS_PATH=$target/extracted" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Проверка механизма подтверждения CI
        run: NODE_TEST_MAX_RSS_MB=2048 bash tests/run-node-tests-safe.sh --test --test-concurrency=2
          tests/server/release-validation.test.js tests/server/release-workflow.test.js
          tests/relay/release-workflow.test.js tests/server/release-checks.test.js
          tests/server/installer-archive-tail.test.js
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Общая сборка web
        run: node tools/releasePipeline.mts tools/releaseRecipe.json --groups build
        env:
          GRIGDESK_PIPELINE_LOG: ${{ runner.temp }}/pipeline-receipts/build.log
          GRIGDESK_PIPELINE_RECEIPTS: ${{ runner.temp }}/pipeline-receipts
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Receipts прогонов проверок
        if: ${{ needs.plan.outputs.run_tests == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: grigdesk-pipeline-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pipeline-receipts
          merge-multiple: true
      - name: Освобождение тестовых артефактов
        run: |
          test "$GRIGDESK_TEST_DEEPSEEK_ROOT" = "$RUNNER_TEMP/deepseek-tests"
          rm -rf -- "$GRIGDESK_TEST_DEEPSEEK_ROOT"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Ключ подписи
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-signing.pem"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
      - name: Описание проверок в подписанном выпуске
        run: node tools/releaseChecks.mts notes release-plan/release-checks.json
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
      - name: Сборка комплекта
        run: GRIGDESK_RELEASE_SIGNING_KEY="$RUNNER_TEMP/release-signing.pem" node tools/bundle.mts 3>&1
        env:
          GRIGDESK_CTL_BUILD_OBSERVED: '1'
          GRIGDESK_RELEASE_ORIGIN: ${{ secrets.RELEASE_SITE_PUBLIC_ORIGIN || 'https://grigdesk.com' }}
      - name: Deb-пакет
        run: node tools/buildDeb.mts
      - name: Свидетельство проверок
        run: |-
          cp release-plan/*.json release-artifacts/
          if ls "$RUNNER_TEMP"/pipeline-receipts/pipeline-*.json >/dev/null 2>&1; then
            cp "$RUNNER_TEMP"/pipeline-receipts/pipeline-*.json release-artifacts/
          fi
          node tools/releaseChecks.mts attach release-artifacts/release-checks.json
      - name: Артефакты проверочного выпуска
        id: artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-${{ inputs.channel }}-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
  verify:
    name: Проверка готовых пакетов
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Зависимости проверки
        run: bash tools/ci/provision-ubuntu.sh --disposable-environment
      - name: Проверка готовых пакетов
        run: NODE_TEST_MAX_RSS_MB=4096 NODE_TEST_HEAP_MB=1024 bash tests/run-node-tests-safe.sh tools/verifyRelease.mts release-artifacts
        env:
          GRIGDESK_RELEASE_REQUIRE_PIPELINE_RECEIPT: ${{ needs.plan.outputs.require_pipeline_receipt }}
          GRIGDESK_RELEASE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      - name: Сохранение результата проверки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/verified-proof.json
          if-no-files-found: error
  publish:
    name: Публикация на сайт
    needs:
      - plan
      - build
      - verify
    if: >-
      ${{ !cancelled() && inputs.publish && needs.plan.result == 'success' &&
      needs.build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: Идентичность выпуска
        run: node tools/release-identity.mts
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Получение артефакта
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Зависимости публикации
        run: npm --prefix server ci
      - name: Ключ сайта
        env:
          SITE_KEY: ${{ secrets.RELEASE_SITE_KEY }}
          MIRROR_KEY: ${{ secrets.RELEASE_SITE_MIRROR_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-site-key"
          printf '%s' "$SITE_KEY" > "$RUNNER_TEMP/release-site-key"
          if [ -n "$MIRROR_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/release-site-mirror-key"
            printf '%s' "$MIRROR_KEY" > "$RUNNER_TEMP/release-site-mirror-key"
          fi
      - name: Публикация на сайт
        run: node tools/release-publish.mts "$PWD"
        env:
          RELEASE_SITE_HOST: ${{ secrets.RELEASE_SITE_HOST }}
          RELEASE_SITE_USER: ${{ secrets.RELEASE_SITE_USER }}
          RELEASE_SITE_PORT: ${{ secrets.RELEASE_SITE_PORT || '22' }}
          RELEASE_SITE_KEY: ${{ runner.temp }}/release-site-key
          RELEASE_SITE_DIR: ${{ secrets.RELEASE_SITE_DIR }}
          RELEASE_SITE_PUBLIC_ORIGIN: ${{ secrets.RELEASE_SITE_PUBLIC_ORIGIN }}
          RELEASE_SITE_MIRROR_HOST: ${{ secrets.RELEASE_SITE_MIRROR_HOST }}
          RELEASE_SITE_MIRROR_USER: ${{ secrets.RELEASE_SITE_MIRROR_USER }}
          RELEASE_SITE_MIRROR_PORT: ${{ secrets.RELEASE_SITE_MIRROR_PORT || '22' }}
          RELEASE_SITE_MIRROR_KEY: ${{ runner.temp }}/release-site-mirror-key
          RELEASE_SITE_MIRROR_DIR: ${{ secrets.RELEASE_SITE_MIRROR_DIR }}
          RELEASE_SITE_MIRROR_PUBLIC_ORIGIN: ${{ secrets.RELEASE_SITE_MIRROR_PUBLIC_ORIGIN }}
run-name: "${{ inputs.channel }}: ${{ inputs.test_mode }} — выпуск #${{ github.run_number }}"
