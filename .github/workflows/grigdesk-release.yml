    needs: [plan, linux_candidate_verify, macos_verify]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.macos_verify.result == 'success' &&
          ((needs.plan.outputs.platforms == 'macos' && needs.linux_candidate_verify.result == 'skipped') ||
           (needs.plan.outputs.platforms == 'linux-and-macos' && needs.linux_candidate_verify.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_PLATFORMS: ${{ needs.plan.outputs.platforms }}
      CANDIDATE_PLAN_SHA256: ${{ needs.plan.outputs.candidate_plan_sha256 }}
      CANDIDATE_SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
      CANDIDATE_RECIPE_DIGEST: ${{ needs.plan.outputs.recipe_digest }}
      CANDIDATE_VERSION: ${{ needs.plan.outputs.version }}
      CANDIDATE_PREVIOUS_VERSION: ${{ needs.plan.outputs.previous_version }}
      LINUX_PUBLIC_KEY: ${{ needs.linux_candidate_verify.outputs.public_key }}
      LINUX_SIGNER_FINGERPRINT: ${{ needs.linux_candidate_verify.outputs.signer_fingerprint }}
      LINUX_MANIFEST_DIGEST: ${{ needs.linux_candidate_verify.outputs.manifest_digest }}
      LINUX_FILE_DIGEST: ${{ needs.linux_candidate_verify.outputs.file_digest }}
      MAC_PUBLIC_KEY: ${{ needs.macos_verify.outputs.public_key }}
      MAC_SIGNER_FINGERPRINT: ${{ needs.macos_verify.outputs.signer_fingerprint }}
      MAC_MANIFEST_DIGEST: ${{ needs.macos_verify.outputs.manifest_digest }}
      MAC_FILE_DIGEST: ${{ needs.macos_verify.outputs.file_digest }}
      MAC_SOURCE_PIN_ID: ${{ needs.macos_verify.outputs.source_runtime_pin_receipt_id }}
      MAC_SOURCE_PIN_SHA256: ${{ needs.macos_verify.outputs.source_runtime_pin_receipt_sha256 }}
    steps:
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Версия Node из manifest
        id: node_runtime
        run: |
          python3 -c 'import json, os; v=json.load(open("server/build/node-runtime.json"))["version"]; print("version="+v, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
      - name: План кандидатов по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-plan
          merge-multiple: true
      - name: Проверенный Linux по ID
        if: ${{ needs.plan.outputs.platforms == 'linux-and-macos' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux_candidate_verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-linux
          merge-multiple: true
      - name: Проверенный Mac по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.macos_verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-macos
          merge-multiple: true
      - name: Закреплённый Mac source receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.macos_verify.outputs.source_runtime_pin_receipt_id }}
          path: ${{ runner.temp }}/source-pin
          merge-multiple: true
      - name: Сверка выбранных платформ
        id: collect
        run: |
          node tools/platformCandidate.mts collect "$RUNNER_TEMP/verified-linux" \
            "$RUNNER_TEMP/verified-macos" verified-candidates
      - name: Кандидат linux-x64
        id: linux
        if: ${{ needs.plan.outputs.platforms == 'linux-and-macos' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-candidate-linux-x64-${{ needs.plan.outputs.version }}
          path: verified-candidates/linux-x64
          if-no-files-found: error
      - name: Кандидат darwin-arm64
        id: macos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grigdesk-candidate-darwin-arm64-${{ needs.plan.outputs.version }}
          path: verified-candidates/darwin-arm64
          if-no-files-found: error
      - name: Итог проверки
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          LINUX_ID: ${{ steps.linux.outputs.artifact-id }}
          MACOS_ID: ${{ steps.macos.outputs.artifact-id }}
          LINUX_SHA: ${{ steps.collect.outputs.linux_installer_sha256 }}
          MACOS_SHA: ${{ steps.collect.outputs.macos_installer_sha256 }}
        run: |
          printf '## GrigDesk %s\n\nCommit `%s`\n\n' "$VERSION" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf '| Платформа | Artifact ID | SHA-256 установщика | Проверки |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CANDIDATE_PLATFORMS" = linux-and-macos ]; then
            printf '| Linux x64 | %s | %s | Пройдены |\n' "$LINUX_ID" "$LINUX_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '| macOS ARM64 | %s | %s | Пройдены |\n' "$MACOS_ID" "$MACOS_SHA" >> "$GITHUB_STEP_SUMMARY"
