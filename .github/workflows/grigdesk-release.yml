name: Профильная проверка сервера
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: grigdesk-server-focused-0.1.0
  cancel-in-progress: false
jobs:
  server:
    name: "Сервер: профильная проверка"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Окружение тестов
        run: |
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-tests/node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: c68e024beaaebde2e1a8c4442306a1b301e5bc59
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Место для native-сборок
        run: >
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted

          df -h "$GITHUB_WORKSPACE"

          sudo du -sh /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null ||
          true

          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL

          df -h "$GITHUB_WORKSPACE"
      - name: Песочница native-проверок
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          sudo tee /etc/apparmor.d/grigdesk-ci-bwrap > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-bwrap
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- /usr/bin/true
          sudo tee /etc/apparmor.d/grigdesk-ci-unshare > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile grigdesk-ci-unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-unshare
          unshare -Urnm /usr/bin/true
      - name: Системные средства тестов
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg ripgrep python3-pil
          ffmpeg -version
          ffprobe -version
          rg --version
          python3 -c 'from PIL import Image; print(Image.__version__)'
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Браузер тестов
        run: node server/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Песочница Chromium
        run: >
          index=0

          while IFS= read -r browser; do
            index=$((index + 1))
            profile="/etc/apparmor.d/grigdesk-ci-chromium-$index"
            sudo tee "$profile" > /dev/null <<APPARMOR
          abi <abi/4.0>,

          include <tunables/global>

          profile grigdesk-ci-chromium-$index "$browser" flags=(unconfined) {
            userns,
          }

          APPARMOR
            sudo apparmor_parser -r "$profile"
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell
          \))

          test "$index" -gt 0

          node --input-type=module <<'NODE'

          import { chromium } from './server/node_modules/playwright-core/index.mjs';


          for (const channel of [undefined, 'chromium']) {
            const browser = await chromium.launch({ headless: true, chromiumSandbox: true, channel });

            try {
              const page = await browser.newPage();

              await page.goto('data:text/html,<title>sandbox probe</title>');

              if (await page.title() !== 'sandbox probe') {
                throw new Error('chromium_sandbox_probe_failed');
              }
            } finally {
              await browser.close();
            }
          }

          NODE
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Подготовка среды тестового исполнителя
        run: npm --prefix deepseek run prepare:runtime -- --node-cache-dir "$GRIGDESK_DEEPSEEK_NODE_CACHE"
      - name: Исходники тестового исполнителя
        run: |
          node --input-type=module <<'NODE'
          import { materializeDeepSeekSnapshot } from './deepseek/scripts/deepseekVendorManifest.ts';
          await materializeDeepSeekSnapshot('./deepseek/vendor/deepseek-harness');
          NODE
      - name: Прогрев вариантов тестового ELF
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh tests/helpers/deepseekBinary.mts
          --prepare-suite > "$RUNNER_TEMP/deepseek-test-suite.json"
      - name: Прогрев среды миграции
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh tests/helpers/deepseekRuntimeArtifact.mts
      - name: Проверка тестового ELF
        run: NODE_TEST_MAX_RSS_MB=4096 bash tests/run-node-tests-safe.sh --test
          tests/server/deepseek-binary-cache-root.test.js
      - name: Три серверных файла
        id: server_tests
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: >
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

          free -m

          getconf _NPROCESSORS_ONLN

          available_kib=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')

          if [ "$available_kib" -lt 16777216 ]; then
            printf '%s\n' "Для полного native-набора нужно 16 GiB; доступно $available_kib KiB"
            exit 1
          fi

          NODE_TEST_MAX_RSS_MB=4096 NODE_TEST_HEAP_MB=1024 bash tests/run-node-tests-safe.sh --test
          --test-concurrency=2 tests/server/mobile-history.test.js
          tests/server/provider-lifecycle-service.test.js tests/server/providers-native-settings-route.test.js
    env:
      GRIGDESK_RELEASE_VERSION: 0.1.0-dev.18
      GRIGDESK_RELEASE_CHANNEL: dev
      GRIGDESK_RELEASE_COMMIT: c68e024beaaebde2e1a8c4442306a1b301e5bc59
      GRIGDESK_RELEASE_ID: dev/0.1.0-dev.18/c68e024beaaebde2e1a8c4442306a1b301e5bc59
run-name: "Server: readiness, очистка и место c68e024b"
