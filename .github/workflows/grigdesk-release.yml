name: Web GrigDesk — отдельная диагностика
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: grigdesk-web-diagnostic-0.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Окружение тестов
        run: >
          printf '%s\n' \
            "GRIGDESK_TEST_DEEPSEEK_ROOT=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_ARTIFACTS_DIR=$RUNNER_TEMP/deepseek-tests" \
            "GRIGDESK_DEEPSEEK_NODE_CACHE=$RUNNER_TEMP/deepseek-tests/node-cache" >> "$GITHUB_ENV"
      - name: Исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: da4da9a7003366373f64c697500c266aa6cbf80b
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Песочница native-проверок
        run: >
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends bubblewrap apparmor

          sudo tee /etc/apparmor.d/grigdesk-ci-bwrap > /dev/null <<'APPARMOR'

          abi <abi/4.0>,

          include <tunables/global>

          profile grigdesk-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }

          APPARMOR

          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-bwrap

          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc
          --die-with-parent -- /usr/bin/true

          sudo tee /etc/apparmor.d/grigdesk-ci-unshare > /dev/null <<'APPARMOR'

          abi <abi/4.0>,

          include <tunables/global>

          profile grigdesk-ci-unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }

          APPARMOR

          sudo apparmor_parser -r /etc/apparmor.d/grigdesk-ci-unshare

          unshare -Urnm /usr/bin/true
      - name: Системные средства тестов
        run: >
          sudo apt-get install -y --no-install-recommends ffmpeg ripgrep
          python3-pil

          ffmpeg -version

          ffprobe -version

          rg --version

          python3 -c 'from PIL import Image; print(Image.__version__)'
      - name: Зависимости сервера
        run: npm --prefix server ci
      - name: Браузер тестов
        run: node server/node_modules/playwright-core/cli.js install --with-deps
          chromium
      - name: Песочница Chromium
        run: >
          index=0

          while IFS= read -r browser; do
            index=$((index + 1))
            profile="/etc/apparmor.d/grigdesk-ci-chromium-$index"
            sudo tee "$profile" > /dev/null <<APPARMOR
          abi <abi/4.0>,

          include <tunables/global>

          profile grigdesk-ci-chromium-$index "$browser" flags=(unconfined) {
            userns,
          }

          APPARMOR
            sudo apparmor_parser -r "$profile"
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o
          -name chrome-headless-shell \))

          test "$index" -gt 0

          node --input-type=module <<'NODE'

          import { chromium } from
          './server/node_modules/playwright-core/index.mjs';


          for (const channel of [undefined, 'chromium']) {
            const browser = await chromium.launch({ headless: true, chromiumSandbox: true, channel });

            try {
              const page = await browser.newPage();

              await page.goto('data:text/html,<title>sandbox probe</title>');

              if (await page.title() !== 'sandbox probe') {
                throw new Error('chromium_sandbox_probe_failed');
              }
            } finally {
              await browser.close();
            }
          }

          NODE
      - name: Зависимости web
        run: npm --prefix web ci
      - name: Зависимости мобильных инструментов
        run: npm --prefix mobile ci
      - name: Зависимости комплекта
        run: |
          npm --prefix tracker ci
          npm --prefix relay ci
          npm --prefix deepseek ci
          npm --prefix desktop ci
      - name: Тесты web
        id: web_tests
        run: NODE_TEST_MAX_RSS_MB=4096 NODE_TEST_HEAP_MB=1024 bash
          tests/run-node-tests-safe.sh --test --test-concurrency=2
          tests/web/client-phone.test.js
          tests/web/computer-resources-baseline.component.test.js
          tests/web/i18n-browser.test.js tests/web/i18n-preservation.test.js
          tests/web/in-app-alerts-wiring.contract.test.js
          tests/web/loading-layouts.browser.test.js
          tests/web/loading-major.browser.test.js
          tests/web/projects-responsive.test.js
          tests/web/shell-language.component.test.js
          tests/web/tracker-settings.browser.test.js
          tests/web/ui-select.browser.test.js
        env:
          NODE_OPTIONS: --test-reporter=tap
    env:
      GRIGDESK_RELEASE_VERSION: 0.1.0-dev.18
      GRIGDESK_RELEASE_CHANNEL: dev
      GRIGDESK_RELEASE_COMMIT: da4da9a7003366373f64c697500c266aa6cbf80b
      GRIGDESK_RELEASE_ID: dev/0.1.0-dev.18/da4da9a7003366373f64c697500c266aa6cbf80b
run-name: "Web: 11 исправленных файлов da4da9a7"
